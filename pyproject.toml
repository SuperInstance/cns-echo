[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cns-echo"
version = "0.1.0"
description = "Simple CNS echo agent — receives USCP signals and echoes back with analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SuperInstance"}]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
cns-echo = "cns_echo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
